<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a20">
  <title>Max Fitness Today</title>
  <style>
    :root{
      --bg:#f2f4f3;--card:#ffffff;--ink:#13222a;--soft:#536872;--line:#dbe3e1;
      --accent:#1f7a6d;--accent-ink:#ffffff;--warm:#b8750f;--chip:#e7efed;--done:#e1f2ea;
      --lift:#1f7a6d;--ride:#2d6fb3;--hiit:#c2462e;--rest:#7a6a3a;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
      color-scheme:light;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#0d171c;--card:#16232a;--ink:#eaf1f2;--soft:#a1b3b9;--line:#2a3b44;
        --accent:#3fb8a4;--accent-ink:#0b1418;--warm:#f0b450;--chip:#20323b;--done:#16382f;
        --lift:#3fb8a4;--ride:#5ea2e6;--hiit:#ef7a5f;--rest:#c9b27a;--shadow:none;
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"]{
      --bg:#0d171c;--card:#16232a;--ink:#eaf1f2;--soft:#a1b3b9;--line:#2a3b44;
      --accent:#3fb8a4;--accent-ink:#0b1418;--warm:#f0b450;--chip:#20323b;--done:#16382f;
      --lift:#3fb8a4;--ride:#5ea2e6;--hiit:#ef7a5f;--rest:#c9b27a;--shadow:none;color-scheme:dark;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
    .wrap{max-width:42rem;margin:0 auto;padding:0 16px 96px}
    header{padding:20px 0 6px}
    .kicker{color:var(--soft);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
    h1{margin:.1rem 0 .1rem;font-size:1.85rem;line-height:1.15;letter-spacing:-.02em}
    .sub{color:var(--soft);margin:0}
    .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 8px}
    .days button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 0 7px;font:inherit;font-size:.75rem;line-height:1.2;cursor:pointer;position:relative}
    .days button b{display:block;font-size:1rem}
    .days button i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--k,transparent)}
    .days button.today{border-color:var(--warm);border-width:2px}
    .days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0 4px}
    .seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
    .seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 16px;border-radius:999px;cursor:pointer}
    .seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:700}
    section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .hero{border-top:6px solid var(--k);padding-top:14px}
    .hero h2{margin:0 0 6px;font-size:1.45rem;line-height:1.2}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
    .chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
    .chip.k{background:var(--k);color:#fff}
    .bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:10px 0 4px}
    .bar span{display:block;height:100%;width:0;background:var(--k);transition:width .3s}
    .barlbl{font-size:.8rem;color:var(--soft)}
    .phase{background:var(--chip);border-radius:14px;padding:10px 14px;margin:10px 0 0;font-size:.9rem}
    .phase b{display:block}
    h3{margin:0 0 6px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
    h3 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--k);color:#fff;font-size:.85rem;flex:none}
    h3 .t{color:var(--soft);font-weight:500;font-size:.85rem;margin-left:auto}
    h4{margin:14px 0 4px;font-size:.95rem}
    h4 small{color:var(--soft);font-weight:500}
    .goal{color:var(--soft);font-size:.9rem;margin:0 0 6px}
    .meta{color:var(--soft);margin:0 0 4px}
    ol.steps,ul.steps{margin:6px 0 0;padding-left:1.25rem}
    ol.steps li,ul.steps li{margin:4px 0}
    .item{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
    .item:first-of-type{border-top:0}
    .tick{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;cursor:pointer;margin-top:2px;color:var(--accent);font-weight:800;padding:0}
    .tick[aria-pressed="true"]{background:var(--done);border-color:var(--accent)}
    .tick[aria-pressed="true"]::after{content:"✓"}
    .item .nm{font-weight:650}
    .item .ds{color:var(--soft);font-size:.88rem}
    .item p{margin:2px 0;font-size:.92rem}
    .ex{border-top:1px solid var(--line);padding:16px 0}
    .ex:first-of-type{border-top:0;padding-top:4px}
    .ex-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .ex-name{font-weight:750;font-size:1.15rem}
    .dose{font-weight:700;white-space:nowrap}
    .exmeta{color:var(--soft);font-size:.85rem;margin:0 0 8px}
    .video{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;overflow:hidden;background:#1b2a31 center/cover no-repeat;cursor:pointer;padding:0;color:#fff;font:inherit;text-align:left}
    .video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center}
    .video .play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
    .video .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:.85rem;line-height:1.3}
    .video .cap b{display:block;font-size:.95rem}
    .frame{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block;background:#000}
    .vlinks{display:flex;justify-content:space-between;font-size:.8rem;margin-top:4px}
    .vlinks a{color:var(--soft)}
    .guide{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--chip)}
    .guide::before{content:"📖";font-size:1.3rem}
    .guide b{display:block;font-size:.95rem}
    .guide span{font-size:.82rem;color:var(--soft)}
    .mini-vid{font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;margin-top:4px;cursor:pointer;font:inherit;font-size:.8rem}
    .variant{margin:10px 0 6px;padding:9px 11px;background:var(--chip);border-radius:10px;font-size:.95rem}
    .variant .tag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--k);margin-right:6px}
    .nogear{font-size:.85rem;color:var(--soft);margin:4px 0}
    .why{font-size:.93rem;margin:6px 0}
    .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
    .set{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
    .set[aria-pressed="true"]{background:var(--done);border-color:var(--accent);color:var(--accent)}
    .wt{width:92px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 10px}
    .mini{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.85rem;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
    .primary{background:var(--k,var(--accent));color:#fff;border:0;font-weight:700;padding:12px 16px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;width:100%}
    .src{font-size:.78rem;color:var(--soft)}
    .note{font-size:.9rem;color:var(--soft)}
    .safety{font-size:.9rem;border-left:3px solid var(--warm);padding-left:10px;margin:10px 0 0}
    details{margin-top:8px}
    details summary{cursor:pointer;font-weight:650;padding:4px 0;font-size:.93rem;color:var(--k,var(--accent))}
    details.sec>summary{color:var(--ink);font-size:1.05rem;list-style:none}
    details.sec>summary::-webkit-details-marker{display:none}
    .how dl{margin:6px 0}
    .how dt{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin-top:8px}
    .how dd{margin:2px 0 0}
    .ev{font-size:.85rem;color:var(--soft);margin:4px 0;padding-left:10px;border-left:2px solid var(--line)}
    .ev a{color:inherit}
    table.effort{width:100%;border-collapse:collapse;font-size:.88rem}
    table.effort td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
    table.effort td:first-child{font-weight:700;white-space:nowrap}
    .wx{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:.92rem}
    .wx b{display:block;font-size:1rem}
    .habit{padding:8px 0;border-top:1px solid var(--line)}
    .habit:first-of-type{border-top:0}
    .habit .nm{font-weight:650}
    .habit .ds{font-size:.9rem}
    .habit .wy{font-size:.83rem;color:var(--soft)}
    textarea.log{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.9rem;background:var(--chip);color:var(--ink);margin-top:8px}
    .timer{white-space:nowrap;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;border:0;font-family:inherit;font-variant-numeric:tabular-nums;z-index:5}
    .timer.on{display:block}
    footer{color:var(--soft);font-size:.82rem;margin-top:24px}
    :focus-visible{outline:3px solid var(--warm);outline-offset:2px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker" id="kicker">Loading</div>
      <h1 id="title">Max Fitness Today</h1>
      <p class="sub" id="sub"></p>
    </header>
    <nav class="days" id="days" aria-label="Days this week"></nav>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Where you train">
        <button type="button" id="loc-home" aria-pressed="true">Home</button>
        <button type="button" id="loc-gym" aria-pressed="false">Gym</button>
      </div>
      <input type="date" id="date" aria-label="Pick a date" class="mini">
    </div>
    <main id="main" aria-live="polite"><section><p>Loading today's workout.</p></section></main>
    <footer>
      <p>General fitness programming, not medical advice. Stop for chest pain, faintness, unusual breathlessness or sharp pain.</p>
      <p>Videos belong to their creators and open from YouTube. Ticks and weights stay on this phone only.</p>
      <p id="version"></p>
    </footer>
  </div>
  <button type="button" class="timer" id="timer" aria-live="polite">Rest</button>
  <noscript><p>Today's line is in the brief folder: brief/YYYY-MM-DD.txt</p></noscript>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
